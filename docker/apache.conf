# Document root is /public; every request that is not a real file goes to index.php.
# The port is rewritten at start-up from the PORT environment variable (Railway sets it).
Listen 8080
<VirtualHost *:8080>
    ServerName mark6
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
    <Directory /var/www/html>
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>
    # Static assets: long cache, HTML never cached
    <FilesMatch "\.(css|js|svg|png|webmanifest)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
